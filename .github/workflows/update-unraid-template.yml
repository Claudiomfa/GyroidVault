name: Update Unraid Template

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-template:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update Unraid Template
        shell: bash
        env:
          VERSION: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          set -e

          XML_FILE="templates/GyroidVault.xml"
          DATE=$(date -u +'%Y-%m-%d')

          echo "======================================"
          echo "Updating Unraid Template"
          echo "Version: $VERSION"
          echo "Date: $DATE"
          echo "File: $XML_FILE"
          echo "======================================"

          # Verify XML exists
          if [ ! -f "$XML_FILE" ]; then
            echo "ERROR: $XML_FILE does not exist."
            exit 1
          fi

          # Update version
          sed -i \
            "s|<Version>[^<]*</Version>|<Version>$VERSION</Version>|" \
            "$XML_FILE"

          # Update date
          sed -i \
            "s|<Date>[^<]*</Date>|<Date>$DATE</Date>|" \
            "$XML_FILE"

          # Create new release notes
          {
            echo "### $VERSION ($DATE)"
            echo ""

            if [ -n "$RELEASE_BODY" ]; then
              printf '%s\n' "$RELEASE_BODY"
            else
              echo "- Release $VERSION"
            fi

            echo ""
          } > new_changes.txt

          # Insert release notes immediately after <Changes>
          awk '
            /<Changes>/ {
              print
              while ((getline line < "new_changes.txt") > 0) {
                print line
              }
              close("new_changes.txt")
              next
            }
            { print }
          ' "$XML_FILE" > "$XML_FILE.tmp"

          mv "$XML_FILE.tmp" "$XML_FILE"

          rm -f new_changes.txt

          echo ""
          echo "Template updated successfully."
          echo ""

          grep -E '<Version>|<Date>' "$XML_FILE"

      - name: Validate XML
        shell: bash
        run: |
          set -e

          if command -v xmllint >/dev/null 2>&1; then
            xmllint --noout templates/GyroidVault.xml
            echo "XML validation: OK"
          else
            echo "xmllint not available, skipping XML validation."
          fi

      - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add templates/GyroidVault.xml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "update: Unraid template for ${{ github.event.release.tag_name }}"

          git push origin HEAD:main
