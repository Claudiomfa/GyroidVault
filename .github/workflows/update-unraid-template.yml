name: Update Unraid Template

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-template:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Unraid Template
        shell: bash
        env:
          VERSION: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          set -e

          XML_FILE="templates/GyroidVault.xml"
          DATE=$(date -u +'%Y-%m-%d')

          echo "======================================"
          echo "Updating Unraid Template"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: main"
          echo "Version: $VERSION"
          echo "Date: $DATE"
          echo "======================================"

          if [ ! -f "$XML_FILE" ]; then
            echo "ERROR: $XML_FILE does not exist."
            exit 1
          fi

          sed -i \
            "s|<Version>[^<]*</Version>|<Version>$VERSION</Version>|" \
            "$XML_FILE"

          sed -i \
            "s|<Date>[^<]*</Date>|<Date>$DATE</Date>|" \
            "$XML_FILE"

          {
            echo "### $VERSION ($DATE)"
            echo ""

            if [ -n "$RELEASE_BODY" ]; then
              printf '%s\n' "$RELEASE_BODY"
            else
              echo "- Release $VERSION"
            fi

            echo ""
          } > new_changes.txt

          awk '
            /<Changes>/ {
              print
              while ((getline line < "new_changes.txt") > 0) {
                print line
              }
              close("new_changes.txt")
              next
            }
            { print }
          ' "$XML_FILE" > "$XML_FILE.tmp"

          mv "$XML_FILE.tmp" "$XML_FILE"

          rm -f new_changes.txt

          echo ""
          echo "Template updated:"
          grep -E '<Version>|<Date>' "$XML_FILE"

      - name: Check Git status
        shell: bash
        run: |
          git status
          echo ""
          echo "Changes:"
          git diff -- templates/GyroidVault.xml

      - name: Commit changes
        shell: bash
        run: |
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add templates/GyroidVault.xml

          echo "Staged changes:"
          git diff --cached --stat

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "update: Unraid template for ${{ github.event.release.tag_name }}"

      - name: Push changes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          echo "Pushing to main..."

          git push origin HEAD:main

          echo "Push completed successfully."
