name: Update Unraid Template

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-template:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Unraid XML
        shell: bash
        env:
          VERSION: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          set -e

          XML_FILE="templates/GyroidVault.xml"
          DATE=$(date -u +'%Y-%m-%d')

          echo "Updating $XML_FILE"
          echo "Version: $VERSION"
          echo "Date: $DATE"

          # Check XML exists
          if [ ! -f "$XML_FILE" ]; then
            echo "ERROR: $XML_FILE not found."
            exit 1
          fi

          # Update Version
          sed -i \
            "s|<Version>[^<]*</Version>|<Version>$VERSION</Version>|" \
            "$XML_FILE"

          # Update Date
          sed -i \
            "s|<Date>[^<]*</Date>|<Date>$DATE</Date>|" \
            "$XML_FILE"

          # Create new Changes entry
          {
            echo "### $VERSION ($DATE)"

            if [ -n "$RELEASE_BODY" ]; then
              printf '%s\n' "$RELEASE_BODY"
            else
              echo "- Release $VERSION"
            fi

            echo ""
          } > new_changes.txt

          # Insert the new release notes immediately after <Changes>
          awk '
            /<Changes>/ {
              print
              while ((getline line < "new_changes.txt") > 0) {
                print line
              }
              close("new_changes.txt")
              next
            }
            { print }
          ' "$XML_FILE" > temp.xml

          mv temp.xml "$XML_FILE"

          rm -f new_changes.txt

          echo "XML updated successfully."

      - name: Show changes
        run: |
          git diff -- templates/GyroidVault.xml

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add templates/GyroidVault.xml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "update: Unraid template for ${{ github.event.release.tag_name }}"

          git push
