name: Update Unraid Template

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  update-template:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update XML File
        shell: bash
        env:
          VERSION: ${{ github.event.release.tag_name }}
          RELEASE_BODY: ${{ github.event.release.body }}
        run: |
          DATE=$(date +'%Y-%m-%d')

          echo "$RELEASE_BODY" > release_notes.txt

          # Update Version
          sed -i "s|<Version>.*</Version>|<Version>$VERSION</Version>|g" templates/GyroidVault.xml

          # Update Date
          sed -i "s|<Date>.*</Date>|<Date>$DATE</Date>|g" templates/GyroidVault.xml

          # Prepare new changes
          echo "### $VERSION ($DATE)" > new_changes.txt
          cat release_notes.txt >> new_changes.txt
          echo "" >> new_changes.txt

          # Insert changes after <Changes>
          awk '
            /<Changes>/ {
              print
              while (getline line < "new_changes.txt") {
                print line
              }
              next
            }
            { print }
          ' templates/GyroidVault.xml > temp.xml

          mv temp.xml templates/GyroidVault.xml

          rm -f release_notes.txt new_changes.txt

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add templates/GyroidVault.xml

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "update: Unraid template for ${{ github.event.release.tag_name }}"
          git push
